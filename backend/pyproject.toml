[project]
name = "feedo-backend"
version = "0.1.0"
description = "Django and Strawberry GraphQL backend for Feedo."
requires-python = ">=3.12"
dependencies = [
  "Django>=5.0,<6.0",
  "django-allauth[headless]>=65.0,<66.0",
  "django-cors-headers>=4.0,<5.0",
  "psycopg[binary]>=3.0,<4.0",
  "redis>=5.0,<6.0",
  "strawberry-graphql-django>=0.50,<1.0",
  "whitenoise>=6.0,<7.0",
]

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["apps*", "config*"]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9.0",
  "pytest-django>=4.0,<5.0",
  "ruff>=0.8,<1.0",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.local"
python_files = ["test_*.py", "*_test.py"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
